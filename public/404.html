<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f6f3ec" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Page not found — Skrivist Books</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f3ec;
        --ink: #273831;
        --muted: #788078;
        --accent: #47624d;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c201e;
          --ink: #e6e7dc;
          --muted: #a1aaa0;
          --accent: #b8cca0;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
        text-align: center;
      }
      main {
        padding: 24px;
      }
      p {
        color: var(--muted);
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>This page isn’t here.</h1>
      <p>Your library lives on the home page.</p>
      <p><a href="/">Back to Skrivist Books</a></p>
    </main>
  </body>
</html>
